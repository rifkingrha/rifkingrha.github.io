<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Inventory-Management-System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="style/app.css">
    <link rel="shortcut icon" type="image/png" href="img/logo-sanbe.png" />
</head>
<body class = login-body>
    <div class="login-box">
        <div class="image-container">
            <img src="img/sanbe-scene.jpg" alt="Sanbe Scene">
        </div>
        <div class="form-container">
            <div class="header">
                <h2>Login</h2>
                <p>Corrective and Preventive Action</p>
            </div>
            <form action="" method="POST">
                <input type="email" name="email" class="input-field" placeholder="Email">
                <div class="password-input">
                    <input type="password" name="password" class="input-field password" placeholder="Password">
                    <span class="password-toggle" id="password-toggle">&#x1F441;</span>
                </div>
                    <span class="help-block with-errors"></span>
                <div class="form-group">
                    <input type="checkbox" name="remember" id="remember" class="agree-term" value=1 />
                    <label for="remember" class="label-agree-term" style="font-size: small;">Remember me</label>
                </div>
                <br>
                <button type="button" name="signin" id="signin" class="submit-btn">Login</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

document.getElementById('password-toggle').addEventListener('click', function() {
    const passwordInput = document.querySelector('.password');
    if (passwordInput.type === 'password'){
        passwordInput.type = 'text';
        this.innerHTML = '&#x2323;';
    } else {
        passwordInput.type = 'password';
        this.innerHTML = '&#x1F441;';
    }
});

document.getElementById('signin').addEventListener('click', function() {
    const email = document.querySelector('input[name="email"]').value;
    const password = document.querySelector('input[name="password"]').value;
    const remember = document.querySelector('input[name="remember"]').checked ? 1 : 0;

    if (!email || !password) {
        Swal.fire({
            icon: 'warning',
            title: 'Incomplete Data',
            text: 'Please enter both email and password.'
        });
        return;
    }

    if(email==="admin@sanbe.com" && password==="sanbe123"){
        Swal.fire({
            icon: 'success',
            title: 'Login Successful',
            text: 'Welcome back!'
        }).then(() => {
            window.location.replace('main.html');
        });
    } else {
        Swal.fire({
            icon: 'error',
            title: 'Login Failed',
            text: 'Invalid email or password.'
        });
    }
});
</script>
</body>
</html>
